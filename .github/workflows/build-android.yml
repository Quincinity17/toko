name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get
      # Analisis & tes sudah dijalankan di workflow Windows; di sini cukup
      # analisis cepat supaya APK tidak dibuat dari kode yang rusak.
      - run: flutter analyze

      # Kunci rilis dari GitHub Secrets (Settings › Secrets and variables ›
      # Actions): ANDROID_KEYSTORE_BASE64 (isi upload-keystore.jks dalam
      # base64) dan ANDROID_KEYSTORE_PASSWORD. Tanpa secret ini APK
      # ditandatangani kunci debug (bisa dipasang untuk dicoba, tapi tidak
      # bisa meng-update aplikasi yang dipasang dari APK rilis).
      - name: Siapkan kunci rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=toko
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      # Satu APK per jenis prosesor; hampir semua HP/tablet sekarang memakai
      # app-arm64-v8a-release.apk.
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: toko-android
          path: build/app/outputs/flutter-apk/*-release.apk
