name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: toko-windows
          path: build/windows/x64/runner/Release/

      # Program server sinkron (toko_server.exe + sqlite3mc.dll) dan skrip
      # pemasangannya.
      - run: dart build cli -t bin/toko_server.dart -o build/server
      - run: Copy-Item tool/server/* build/server/bundle/
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: toko-server-windows
          path: build/server/bundle/

